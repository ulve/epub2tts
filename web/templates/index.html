<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>echo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e8e8e8;
      margin: 0;
      padding: 1.5rem 1rem;
    }
    a { color: #7a8fff; }
    h1 { font-size: 1.5rem; color: #fff; margin: 0 0 .25rem; }
    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 2rem;
    }
    .logout { font-size: .85rem; color: #888; text-decoration: none; }
    .logout:hover { color: #ccc; }
    .card {
      background: #1a1d27;
      border: 1px solid #2e3147;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      max-width: 720px;
    }
    .card h2 { margin: 0 0 1rem; font-size: 1.05rem; color: #ccc; }

    /* Upload form */
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: .82rem; color: #aaa; margin-bottom: .35rem; }
    input[type=file] {
      display: block;
      width: 100%;
      padding: .5rem;
      background: #0f1117;
      border: 1px solid #2e3147;
      border-radius: 8px;
      color: #e8e8e8;
      font-size: .9rem;
    }

    /* Voice picker */
    .voice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: .5rem;
    }
    .voice-item {
      display: flex;
      align-items: center;
      gap: .5rem;
      background: #0f1117;
      border: 1px solid #2e3147;
      border-radius: 8px;
      padding: .5rem .7rem;
      cursor: pointer;
      transition: border-color .15s;
    }
    .voice-item:hover { border-color: #5b6af0; }
    .voice-item.selected { border-color: #5b6af0; background: #1a1f3a; }
    .voice-item input[type=radio] { display: none; }
    .voice-label { font-size: .82rem; flex: 1; line-height: 1.3; }
    .play-btn {
      background: none;
      border: 1px solid #444;
      border-radius: 50%;
      color: #aaa;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: .8rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .play-btn:hover { border-color: #7a8fff; color: #7a8fff; }
    .play-btn.playing { border-color: #f0a050; color: #f0a050; }

    button.submit {
      margin-top: .5rem;
      padding: .6rem 1.4rem;
      background: #5b6af0;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .95rem;
      cursor: pointer;
    }
    button.submit:hover { background: #4a59e0; }

    /* Job list */
    .section-label {
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #666;
      margin: 1.5rem 0 .6rem;
    }
    .job {
      background: #1a1d27;
      border: 1px solid #2e3147;
      border-radius: 10px;
      padding: 1rem 1.2rem;
      margin-bottom: .6rem;
      max-width: 720px;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }
    .job-info { flex: 1; min-width: 0; }
    .job-title { font-size: .97rem; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .job-author { font-size: .82rem; color: #888; margin-top: .1rem; }
    .job-meta { font-size: .78rem; color: #666; margin-top: .3rem; }
    .progress-wrap { margin-top: .6rem; }
    .progress-bar-bg {
      height: 6px;
      background: #2e3147;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: #5b6af0;
      border-radius: 4px;
      transition: width .4s;
    }
    .progress-text { font-size: .75rem; color: #888; margin-top: .3rem; }
    .badge {
      display: inline-block;
      padding: .15rem .55rem;
      border-radius: 99px;
      font-size: .72rem;
      font-weight: 600;
      margin-bottom: .25rem;
    }
    .badge-processing { background: #1e3a5f; color: #60a5fa; }
    .badge-queued     { background: #2a2a2a; color: #aaa; }
    .badge-completed  { background: #14332a; color: #4ade80; }
    .badge-failed     { background: #3b1a1a; color: #f87171; }
    .badge-cancelled  { background: #222; color: #666; }

    .job-actions { display: flex; flex-direction: column; gap: .4rem; align-items: flex-end; flex-shrink: 0; }
    .btn-cancel {
      padding: .3rem .75rem;
      background: none;
      border: 1px solid #444;
      border-radius: 6px;
      color: #aaa;
      font-size: .78rem;
      cursor: pointer;
    }
    .btn-cancel:hover { border-color: #f87171; color: #f87171; }
    .btn-download {
      padding: .3rem .75rem;
      background: #14332a;
      border: 1px solid #166534;
      border-radius: 6px;
      color: #4ade80;
      font-size: .78rem;
      text-decoration: none;
    }
    .btn-download:hover { background: #166534; }
    .empty { color: #555; font-size: .85rem; padding: .5rem 0; max-width: 720px; }
    .error-msg { font-size: .78rem; color: #f87171; margin-top: .3rem; }
  </style>
</head>
<body>

<div class="topbar">
  <h1>echo</h1>
  <a href="/logout" class="logout">Sign out</a>
</div>

<!-- Upload form -->
<div class="card">
  <h2>Convert an epub</h2>
  <form method="post" action="/upload" enctype="multipart/form-data">
    <div class="field">
      <label>epub file</label>
      <input type="file" name="epub" accept=".epub" required>
    </div>
    <div class="field">
      <label>Voice</label>
      <div class="voice-grid" id="voiceGrid">
        {% for voice_id, voice_name in voices %}
        <label class="voice-item {% if loop.first %}selected{% endif %}" data-voice="{{ voice_id }}">
          <input type="radio" name="voice" value="{{ voice_id }}" {% if loop.first %}checked{% endif %}>
          <span class="voice-label">{{ voice_name }}</span>
          <button type="button" class="play-btn" data-voice="{{ voice_id }}" title="Preview">&#9654;</button>
        </label>
        {% endfor %}
      </div>
    </div>
    <button type="submit" class="submit">Add to queue</button>
  </form>
</div>

<!-- Job list -->
<div id="jobList"></div>

<script>
(function () {
  // Voice preview
  let currentAudio = null;
  let currentBtn   = null;

  document.getElementById("voiceGrid").addEventListener("click", function (e) {
    // Select voice item on click
    const item = e.target.closest(".voice-item");
    if (item) {
      document.querySelectorAll(".voice-item").forEach(el => el.classList.remove("selected"));
      item.classList.add("selected");
      item.querySelector("input[type=radio]").checked = true;
    }

    // Play/stop preview
    const btn = e.target.closest(".play-btn");
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();

    const voice = btn.dataset.voice;

    if (currentAudio && currentBtn === btn) {
      currentAudio.pause();
      currentAudio = null;
      btn.classList.remove("playing");
      btn.innerHTML = "&#9654;";
      currentBtn = null;
      return;
    }

    if (currentAudio) {
      currentAudio.pause();
      currentBtn.classList.remove("playing");
      currentBtn.innerHTML = "&#9654;";
    }

    const audio = new Audio("/samples/" + voice + ".mp3");
    currentAudio = audio;
    currentBtn   = btn;
    btn.classList.add("playing");
    btn.innerHTML = "&#9646;&#9646;";

    audio.play();
    audio.onended = function () {
      btn.classList.remove("playing");
      btn.innerHTML = "&#9654;";
      currentAudio = null;
      currentBtn   = null;
    };
  });

  // Job list polling
  function statusBadge(status) {
    const labels = {
      processing: "Processing",
      queued:     "Queued",
      completed:  "Completed",
      failed:     "Failed",
      cancelled:  "Cancelled",
    };
    return `<span class="badge badge-${status}">${labels[status] || status}</span>`;
  }

  function renderJob(job) {
    let progressHtml = "";
    if (job.status === "processing") {
      const pct = job.total > 0 ? Math.round(job.progress / job.total * 100) : 0;
      progressHtml = `
        <div class="progress-wrap">
          <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
          <div class="progress-text">
            ${job.progress}/${job.total} chapters${job.chapter ? " &mdash; " + escHtml(job.chapter) : ""}
            ${job.elapsed ? " &mdash; " + escHtml(job.elapsed) : ""}
          </div>
        </div>`;
    }

    let actionsHtml = "";
    if (job.status === "queued" || job.status === "processing") {
      actionsHtml = `<button class="btn-cancel" onclick="cancelJob(${job.id})">Cancel</button>`;
    }
    if (job.status === "completed" && job.download_url) {
      actionsHtml = `<a class="btn-download" href="${job.download_url}" download>Download</a>`;
    }
    if (job.status === "failed") {
      actionsHtml = `<a class="btn-cancel" href="/logs/${job.id}" target="_blank" style="text-decoration:none;display:inline-block">View logs</a>`;
    }

    let errorHtml = "";
    if (job.status === "failed" && job.error_msg) {
      errorHtml = `<div class="error-msg">${escHtml(job.error_msg)}</div>`;
    }

    const meta = [job.voice];
    if (job.elapsed && job.status === "completed") meta.push(job.elapsed);
    if (job.elapsed && job.status === "failed")     meta.push(job.elapsed);

    return `
      <div class="job" id="job-${job.id}">
        <div class="job-info">
          ${statusBadge(job.status)}
          <div class="job-title">${escHtml(job.title)}</div>
          <div class="job-author">${escHtml(job.author)}</div>
          <div class="job-meta">${meta.map(escHtml).join(" &middot; ")}</div>
          ${progressHtml}
          ${errorHtml}
        </div>
        <div class="job-actions">${actionsHtml}</div>
      </div>`;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderJobs(jobs) {
    const sections = [
      { key: "processing", label: "Processing" },
      { key: "queued",     label: "Queued" },
      { key: "completed",  label: "Completed" },
      { key: "failed",     label: "Failed" },
      { key: "cancelled",  label: "Cancelled" },
    ];

    let html = "";
    for (const { key, label } of sections) {
      const group = jobs.filter(j => j.status === key);
      if (group.length === 0) continue;
      html += `<div class="section-label">${label}</div>`;
      group.forEach(j => { html += renderJob(j); });
    }

    if (!html) {
      html = '<p class="empty">No jobs yet. Upload an epub above to get started.</p>';
    }

    document.getElementById("jobList").innerHTML = html;
  }

  function fetchJobs() {
    fetch("/jobs")
      .then(r => r.json())
      .then(renderJobs)
      .catch(console.error);
  }

  window.cancelJob = function (id) {
    if (!confirm("Cancel this job?")) return;
    fetch("/cancel/" + id, { method: "POST" })
      .then(() => fetchJobs())
      .catch(console.error);
  };

  fetchJobs();
  setInterval(fetchJobs, 30000);
})();
</script>

</body>
</html>
