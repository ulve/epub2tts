services:
  epub2tts:
    build:
      context: .
      dockerfile: Dockerfile.processor
      args:
        BASE_IMAGE: python:3.11-slim
    volumes:
      - ./epub:/data/epub
      - ./audiobooks:/data/audiobooks
    environment:
      - TTS_ENGINE=kokoro
      - EPUB2TTS_ARGS=--skiplinks --skipfootnotes --speaker af_sky
    restart: "no"
